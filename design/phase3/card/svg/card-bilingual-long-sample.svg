<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1486" viewBox="0 0 1080 1486"><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .09  0 0 0 0 .12  0 0 0 0 .09  0 0 0 .09 0"/></filter><filter id="blot" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3"/><feColorMatrix type="matrix" values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .12  0 0 0 .10 -.03"/></filter><radialGradient id="wax" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#F3BF88"/><stop offset=".55" stop-color="#B9722F"/><stop offset="1" stop-color="#7E4613"/></radialGradient><radialGradient id="seed" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#FAD9AE"/><stop offset="1" stop-color="#A9672A"/></radialGradient></defs><rect width="1080" height="1486" fill="#E9E4D2"/><rect width="1080" height="1486" filter="url(#blot)"/><rect width="1080" height="1486" filter="url(#grain)"/><rect x="36" y="36" width="1008" height="1414" fill="none" stroke="#162018" stroke-opacity=".28" stroke-width="1.5"/><rect x="46" y="46" width="988" height="1394" fill="none" stroke="#162018" stroke-opacity=".12" stroke-width="1"/><text x="84" y="118" font-family="'Instrument Sans', system-ui, sans-serif" font-weight="600" font-size="22" letter-spacing="3.5" fill="#555F50">FERAL · PAID WORK · BILINGUAL CARD</text><text x="996" y="118" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="21" fill="#555F50">stress-test</text><g fill="none" stroke="#162018" stroke-width="1.6" stroke-linecap="round" opacity=".55"><path d="M930,300 c-6,-30 -2,-58 18,-84"/><path d="M929,270 c-18,-4 -30,-16 -32,-32 c16,2 28,14 32,32z"/><path d="M936,244 c14,-8 30,-8 40,2 c-12,10 -28,10 -40,-2z"/><path d="M948,216 c-2,-10 4,-18 12,-22"/><ellipse cx="932" cy="308" rx="9" ry="12"/><path d="M932,298 v18" stroke-opacity=".6"/></g><text x="84" y="236" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-weight="500" font-size="76" letter-spacing="-1" fill="#162018">A very long card title</text><text x="84" y="318" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-weight="500" font-size="76" letter-spacing="-1" fill="#162018">that will need two…</text><text x="84" y="410" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="18" fill="#555F50">EN</text><text x="150" y="410" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-size="40" fill="#162018">A creature earns by making useful things.</text><text x="84" y="470" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="18" fill="#1E5466">ES</text><text x="150" y="470" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="40" fill="#1E5466">Una criatura gana creando cosas útiles.</text><line x1="150" y1="506" x2="300" y2="506" stroke="#162018" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 6"/><text x="84" y="554" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="18" fill="#555F50">EN</text><text x="150" y="554" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-size="40" fill="#162018">It pays a neighbour and funds a new life.</text><text x="84" y="614" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="18" fill="#1E5466">ES</text><text x="150" y="614" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="40" fill="#1E5466">Paga a un vecino y financia una nueva vida.</text><line x1="150" y1="650" x2="300" y2="650" stroke="#162018" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 6"/><text x="84" y="698" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="18" fill="#555F50">EN</text><text x="150" y="698" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-size="40" fill="#162018">Every balance can be checked on the chain.</text><text x="84" y="758" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="18" fill="#1E5466">ES</text><text x="150" y="758" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="40" fill="#1E5466">Cada saldo se puede comprobar en la cadena.</text><line x1="150" y1="794" x2="300" y2="794" stroke="#162018" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 6"/><text x="84" y="842" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="18" fill="#555F50">EN</text><text x="150" y="842" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-size="40" fill="#162018">This fourth line checks the wrapping rules</text><text x="150" y="892" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-size="40" fill="#162018">when a sentence runs long enough to need a</text><text x="150" y="942" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-size="40" fill="#162018">second row.</text><text x="84" y="1002" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="18" fill="#1E5466">ES</text><text x="150" y="1002" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="40" fill="#1E5466">Esta cuarta línea prueba el ajuste cuando</text><text x="150" y="1052" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="40" fill="#1E5466">una frase es tan larga que necesita</text><text x="150" y="1102" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="40" fill="#1E5466">otra fila.</text><line x1="150" y1="1138" x2="150" y2="1138" stroke="#162018" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 6"/><path d="M84,1296 C234,1288 346.5,1305 496.50000000000006,1297 S721.5,1289 834,1298" fill="none" stroke="#162018" stroke-width="2" stroke-linecap="round"/><path d="M496.50000000000006,1297 c10,8 14,16 30,20 M309,1298 c-4,10 -14,14 -26,15" fill="none" stroke="#162018" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/><text x="84" y="1342" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="30" fill="#3E4A3C">Wrap and overflow test.</text><text x="84" y="1386" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="24" fill="#162018">Paid 90 MUNCH</text><text x="84" y="1416" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="19" fill="#555F50">Sample content for wrap testing.</text><g transform="rotate(-8 910 1326)"><polygon points="984.0,1326.0 985.4,1344.6 974.7,1359.6 970.5,1378.1 954.8,1386.6 944.5,1403.4 926.0,1401.6 910.0,1409.5 894.0,1401.6 876.4,1401.2 863.9,1388.5 849.5,1378.1 845.3,1359.6 834.6,1344.6 838.2,1326.0 832.4,1306.9 845.3,1292.4 849.5,1273.9 865.2,1265.4 876.4,1250.8 893.5,1248.1 910.0,1242.5 926.0,1250.4 943.6,1250.8 954.8,1265.4 972.2,1272.4 974.7,1292.4 985.4,1307.4" fill="url(#wax)" stroke="#7E4613" stroke-width="2" stroke-linejoin="round"/><ellipse cx="910" cy="1326" rx="56.24" ry="60.68" fill="none" stroke="#7E4613" stroke-opacity=".6" stroke-width="3"/><path d="M910,1284.042 C941.08,1307.352 941.08,1347.756 910,1367.958 C878.92,1347.756 878.92,1307.352 910,1284.042Z" fill="url(#seed)" stroke="#7E4613" stroke-width="2.5"/><path d="M864.12,1354.12 C887.8,1340.8 895.2,1371.88 910,1366.404 C924.8,1371.88 932.2,1340.8 955.88,1354.12" fill="none" stroke="#7E4613" stroke-width="3" stroke-linecap="round"/><path d="M912,1301.136 l-5,21.755999999999997 l6,15.54" fill="none" stroke="#7E4613" stroke-opacity=".7" stroke-width="2"/></g></svg>