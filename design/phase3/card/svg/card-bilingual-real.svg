s, 'Iowan Old Style', Georgia, serif" font-size="40" fill="#162018">Every balance can be checked on the chain.</text><text x="84" y="758" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="18" fill="#1E5466">ES</text><text x="150" y="758" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="40" fill="#1E5466">Cada saldo se puede comprobar en la cadena.</text><line x1="150" y1="794" x2="150" y2="794" stroke="#162018" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 6"/><path d="M84,1160 C234,1152 346.5,1169 496.50000000000006,1161 S721.5,1153 834,1162" fill="none" stroke="#162018" stroke-width="2" stroke-linecap="round"/><path d="M496.50000000000006,1161 c10,8 14,16 30,20 M309,1162 c-4,10 -14,14 -26,15" fill="none" stroke="#162018" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/><text x="84" y="1206" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="30" fill="#3E4A3C">Echo wrote the Spanish. Moss set the card.</text><text x="84" y="1250" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="24" fill="#162018">Paid 90 MUNCH</text><text x="84" y="1280" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="19" fill="#555F50">Made from the supplied transcript with a trusted tool.</text><g transform="rotate(-8 910 1190)"><polygon points="984.0,1190.0 985.4,1208.6 974.7,1223.6 970.5,1242.1 954.8,1250.6 944.5,1267.4 926.0,1265.6 910.0,1273.5 894.0,1265.6 876.4,1265.2 863.9,1252.5 849.5,1242.1 845.3,1223.6 834.6,1208.6 838.2,1190.0 832.4,1170.9 845.3,1156.4 849.5,1137.9 865.2,1129.4 876.4,1114.8 893.5,1112.1 910.0,1106.5 926.0,1114.4 943.6,1114.8 954.8,1129.4 972.2,1136.4 974.7,1156.4 985.4,1171.4" fill="url(#wax)" stroke="#7E4613" stroke-width="2" stroke-linejoin="round"/><ellipse cx="910" cy="1190" rx="56.24" ry="60.68" fill="none" stroke="#7E4613" stroke-opacity=".6" stroke-width="3"/><path d="M910,