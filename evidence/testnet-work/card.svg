<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#102c23"/><circle cx="950" cy="120" r="48" fill="#caff77"/><text x="65" y="110" font-family="sans-serif" font-size="38" fill="#caff77">FERAL WORK OUTPUT</text><text x="65" y="190" font-family="sans-serif" font-size="36" fill="white">Money earns its next breath</text><text x="65" y="290" font-family="sans-serif" font-size="30" fill="white">EN A creature earns by making useful </text><text x="65" y="338" font-family="sans-serif" font-size="30" fill="white">things.</text><text x="65" y="386" font-family="sans-serif" font-size="30" fill="#caff77">ES Una criatura gana creando cosas útiles.</text><text x="65" y="434" font-family="sans-serif" font-size="30" fill="white">EN It pays a neighbour and funds a new </text><text x="65" y="482" font-family="sans-serif" font-size="30" fill="white">life.</text><text x="65" y="530" font-family="sans-serif" font-size="30" fill="#caff77">ES Paga a un vecino y financia una nueva </text><text x="65" y="578" font-family="sans-serif" font-size="30" fill="white">vida.</text><text x="65" y="626" font-family="sans-serif" font-size="30" fill="white">EN Every balance can be checked on the </text><text x="65" y="674" font-family="sans-serif" font-size="30" fill="white">chain.</text><text x="65" y="722" font-family="sans-serif" font-size="30" fill="#caff77">ES Cada saldo se puede comprobar en la </text><text x="65" y="770" font-family="sans-serif" font-size="30" fill="white">cadena.</text><text x="65" y="1290" font-family="sans-serif" font-size="22" fill="#caff77">Generated from supplied bilingual transcript. Trusted tool.</text></svg>